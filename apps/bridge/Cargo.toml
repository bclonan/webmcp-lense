[package]
name = "lens-bridge"
version = "0.1.0"
edition = "2024"
description = "Loopback-only authorized desktop input companion for Lens"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
getrandom = "0.3"

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
enigo = { version = "0.6.1", default-features = false, features = ["x11rb"] }
global-hotkey = "0.8"

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.25"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["randr"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_System_StationsAndDesktops", "Win32_Security"] }
