[build]
  command = "pnpm build"
  publish = "apps/web/dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Revalidate HTML on navigation so an old tab's reload receives the current app.
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-cache, max-age=0, must-revalidate"

[[headers]]
  for = "/app-version.json"
  [headers.values]
    Cache-Control = "no-store"
